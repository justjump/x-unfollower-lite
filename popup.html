<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Followback checker</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1917;
    --surface: #262220;
    --ink: #e8e5e0;
    --soft: #a89e90;
    --line: #35302a;
    --accent: #e0a458;
  }
  * { box-sizing: border-box; }
  body {
    width: 296px;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.55 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  }
  ::selection { background: #e0a45844; }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
  .sub { margin: 0 0 12px; font-size: 12px; color: var(--soft); }
  .stats {
    display: flex;
    gap: 14px;
    padding: 10px 0 12px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 650; }
  .stat span { font-size: 11.5px; color: var(--soft); }
  .stat.warn b { color: var(--accent); }
  button {
    width: 100%;
    padding: 9px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: inherit;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .14s ease;
  }
  button:hover:not(:disabled) { background: #302b26; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    background: #3a2f22;
    border-color: #6b5232;
    color: #f0c690;
    margin-bottom: 8px;
  }
  button.primary:hover:not(:disabled) { background: #453725; }
  .hint { margin: 10px 0 0; font-size: 11px; color: #8c8377; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <div class="stats">
    <div class="stat"><b id="total">–</b><span id="lblTotal"></span></div>
    <div class="stat"><b id="back">–</b><span id="lblBack"></span></div>
    <div class="stat warn"><b id="targets">–</b><span id="lblTargets"></span></div>
  </div>

  <button id="open" class="primary" type="button"></button>
  <button id="only" type="button"></button>

  <p class="hint" id="hint"></p>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
